<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deep Pick Settings</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f1ea;
        --panel: rgba(255, 252, 245, 0.92);
        --ink: #1e2430;
        --muted: #556072;
        --accent: #0f766e;
        --accent-weak: rgba(15, 118, 110, 0.12);
        --border: rgba(30, 36, 48, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at top left, rgba(15, 118, 110, 0.18), transparent 28%),
          radial-gradient(circle at right 20%, rgba(180, 83, 9, 0.12), transparent 24%),
          var(--bg);
        color: var(--ink);
        font: 16px/1.5 "Segoe UI", "PingFang SC", sans-serif;
      }

      .wrap {
        max-width: 760px;
        margin: 48px auto;
        padding: 0 20px;
      }

      .panel {
        padding: 28px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 20px 60px rgba(30, 36, 48, 0.08);
        backdrop-filter: blur(18px);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 32px;
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      .section {
        margin-top: 28px;
      }

      .sectionTitle {
        margin-bottom: 12px;
        font-weight: 700;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
      }

      .card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.66);
      }

      .card input {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
      }

      .labelGroup {
        display: flex;
        flex-direction: column;
      }

      .labelGroup strong {
        font-size: 15px;
      }

      .labelGroup span {
        color: var(--muted);
        font-size: 13px;
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 28px;
      }

      .status {
        color: var(--muted);
        min-height: 24px;
      }

      .status.error {
        color: #b42318;
      }

      .status.success {
        color: var(--accent);
      }

      .actions {
        display: flex;
        gap: 10px;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        font: inherit;
        cursor: pointer;
      }

      .secondary {
        background: rgba(30, 36, 48, 0.08);
        color: var(--ink);
      }

      .primary {
        background: var(--accent);
        color: #fff;
        box-shadow: 0 10px 24px rgba(15, 118, 110, 0.2);
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="panel">
        <h1>Modifier Key Setup</h1>
        <p>Choose the key combination that triggers Deep Pick previews and clicks. Any key you leave unchecked must stay unpressed when you trigger it.</p>

        <div class="section">
          <div class="sectionTitle">Trigger Combination</div>
          <div class="grid">
            <label class="card">
              <input type="checkbox" name="modifier" value="ctrl" />
              <span class="labelGroup">
                <strong>Ctrl</strong>
                <span>Common on Windows and Linux</span>
              </span>
            </label>
            <label class="card">
              <input type="checkbox" name="modifier" value="shift" />
              <span class="labelGroup">
                <strong>Shift</strong>
                <span>Add to the combo</span>
              </span>
            </label>
            <label class="card">
              <input type="checkbox" name="modifier" value="alt" />
              <span class="labelGroup">
                <strong>Alt</strong>
                <span>Helpful for avoiding site conflicts</span>
              </span>
            </label>
            <label class="card">
              <input type="checkbox" name="modifier" value="meta" />
              <span class="labelGroup">
                <strong>Meta</strong>
                <span>Windows key / Command</span>
              </span>
            </label>
          </div>
        </div>

        <div class="footer">
          <div id="status" class="status"></div>
          <div class="actions">
            <button id="resetButton" class="secondary" type="button">Restore Defaults</button>
            <button id="saveButton" class="primary" type="button">Save Settings</button>
          </div>
        </div>
      </section>
    </main>

    <script src="src/shared/settings.js"></script>
    <script src="src/options/main.js"></script>
  </body>
  </html>
